<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市立秀峰高級中學115-1 教師課表查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 解析 CSV 用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- 解析 XLS/XLSX 用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .table-row-sep td { border-bottom: 4px solid #374151 !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-blue-800 text-white p-6 text-center">
            <h1 class="text-3xl font-bold tracking-wider">新北市立秀峰高級中學115-1 教師課表查詢</h1>
        </div>

        <div class="p-6">
            <!-- 搜尋與狀態列 -->
            <div class="bg-blue-50 p-5 rounded-lg border border-blue-200 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between">
                <div class="flex flex-col sm:flex-row w-full md:w-2/3 mb-4 md:mb-0">
                    <label for="teacherInput" class="font-bold text-blue-900 mr-3 mb-2 sm:mb-0 self-start sm:self-center whitespace-nowrap">輸入教師：</label>
                    <div class="flex w-full">
                        <input type="text" id="teacherInput" disabled
                               class="form-input block w-full px-4 py-2 text-base text-gray-700 bg-gray-100 border border-gray-300 rounded-l focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:cursor-not-allowed" 
                               placeholder="資料庫載入中...">
                        <button id="searchBtn" disabled
                                class="px-6 py-2 bg-gray-400 text-white font-medium text-sm leading-tight uppercase rounded-r shadow-md disabled:cursor-not-allowed transition duration-150 ease-in-out whitespace-nowrap">
                            查詢
                        </button>
                    </div>
                </div>
                <div id="statusIndicator" class="text-sm font-bold text-gray-500 w-full md:w-auto text-left md:text-right">
                    🔄 正在尋找 timetable.csv...
                </div>
            </div>

            <!-- 隱藏的上傳區塊 (發生錯誤時顯示) -->
            <div id="fallbackUploadArea" class="hidden bg-yellow-50 p-5 rounded-lg border border-yellow-300 shadow-sm mb-6">
                <h2 class="font-bold text-lg text-red-600 mb-3 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    請將資料庫檔名更正為timetable.csv，或手動匯入CSV檔案
                </h2>
                <label for="fileInput" class="block text-sm font-medium text-gray-700 mb-2">手動上傳正確的課表檔案 (.csv, .xls, .xlsx)：</label>
                <input type="file" id="fileInput" accept=".csv, .xls, .xlsx" 
                       class="block w-full text-sm text-gray-500
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-md file:border-0
                              file:text-sm file:font-semibold
                              file:bg-yellow-600 file:text-white
                              hover:file:bg-yellow-700 cursor-pointer">
            </div>

            <!-- 課表顯示區 -->
            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200 text-center">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-[120px]">節次 \ 星期</th>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-1/5">一</th>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-1/5">二</th>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-1/5">三</th>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-1/5">四</th>
                            <th scope="col" class="px-3 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider w-1/5">五</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                <div id="noDataMessage" class="flex flex-col items-center">
                                    <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                    <p class="text-lg font-medium">尚無資料</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const seniorHighTimes = {
            1: "08:10-09:00", 2: "09:10-10:00", 3: "10:10-11:00", 4: "11:10-12:00",
            5: "13:05-13:55", 6: "14:05-14:55", 7: "15:10-16:00", 8: "16:05-16:55" 
        };

        const juniorHighTimes = {
            1: "08:20-09:05", 2: "09:15-10:00", 3: "10:10-10:55", 4: "11:10-11:55",
            5: "13:05-13:50", 6: "14:05-14:50", 7: "15:10-15:55", 8: "16:05-16:50"
        };

        const weekDayMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7 };
        let scheduleByTeacher = {}; 

        const fileInput = document.getElementById('fileInput');
        const statusIndicator = document.getElementById('statusIndicator');
        const teacherInput = document.getElementById('teacherInput');
        const searchBtn = document.getElementById('searchBtn');
        const timetableBody = document.getElementById('timetableBody');
        const fallbackUploadArea = document.getElementById('fallbackUploadArea');

        // 資料統一處理邏輯 (相容 CSV 與 JSON)
        function processParsedData(parsedData) {
            scheduleByTeacher = {}; 
            let successCount = 0;

            parsedData.forEach(row => {
                const teacher = row['教師'];
                const dayStr = row['星期'] ? row['星期'].toString().trim() : '';
                const day = weekDayMap[dayStr] || parseInt(dayStr); 
                const period = parseInt(row['節次']);
                const subject = row['課程'];
                const className = row['班級'] || '';
                
                let startTime = row['開始時間'] ? row['開始時間'].toString().trim() : '';
                let endTime = row['結束時間'] ? row['結束時間'].toString().trim() : '';
                
                let oddEven = '';
                const rawWeek = row['週別'] || '';
                if (rawWeek.toString().includes('單')) oddEven = '單';
                if (rawWeek.toString().includes('雙')) oddEven = '雙';
                
                const location = row['上課地點'] || '';

                if (!teacher || isNaN(day) || isNaN(period)) return;

                if (!scheduleByTeacher[teacher]) scheduleByTeacher[teacher] = { 1:{}, 2:{}, 3:{}, 4:{}, 5:{} };
                if (!scheduleByTeacher[teacher][day][period]) scheduleByTeacher[teacher][day][period] = [];
                
                const timeStr = (startTime && endTime) ? `${startTime}-${endTime}` : '';

                if (day >= 1 && day <= 5) {
                    scheduleByTeacher[teacher][day][period].push({ subject, className, oddEven, location, timeStr });
                    successCount++;
                }
            });

            if (successCount > 0) {
                statusIndicator.innerHTML = `✅ 成功讀取 <b>${successCount}</b> 筆資料`;
                statusIndicator.className = "text-sm font-bold text-green-600 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";
                
                teacherInput.disabled = false;
                searchBtn.disabled = false;
                teacherInput.classList.remove('bg-gray-100');
                teacherInput.classList.add('bg-white');
                searchBtn.classList.remove('bg-gray-400', 'disabled:cursor-not-allowed');
                searchBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                teacherInput.placeholder = "請輸入教師姓名查詢";
                
                fallbackUploadArea.classList.add('hidden');
                teacherInput.focus();
            } else {
                showErrorFallback();
            }
        }

        // 顯示錯誤訊息與手動上傳區塊
        function showErrorFallback() {
            alert("請將資料庫檔名更正為timetable.csv，或手動匯入CSV檔案");
            statusIndicator.innerHTML = `❌ 載入失敗`;
            statusIndicator.className = "text-sm font-bold text-red-600 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";
            teacherInput.placeholder = "請先上傳檔案才能查詢...";
            fallbackUploadArea.classList.remove('hidden');
        }

        // 解析 Excel 檔案 (供手動上傳使用)
        function parseExcelData(dataBuffer) {
            try {
                const workbook = XLSX.read(dataBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                processParsedData(jsonData);
            } catch (error) {
                showErrorFallback();
            }
        }

        // ===== 鎖定自動載入 timetable.csv =====
        async function attemptAutoLoad() {
            const targetFile = 'timetable.csv';
            try {
                // 先嘗試發送 HEAD 請求，確認檔案是否存在
                const res = await fetch(targetFile, { method: 'HEAD', cache: 'no-store' });
                
                if (res.ok) {
                    statusIndicator.innerHTML = `✅ 找到 ${targetFile}，正在載入...`;
                    // 檔案存在，直接交給 PapaParse 解析
                    Papa.parse(targetFile, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) { 
                            processParsedData(results.data); 
                        },
                        error: function() { 
                            showErrorFallback(); 
                        }
                    });
                } else {
                    // 如果伺服器回傳 404 等錯誤，代表找不到該檔案
                    showErrorFallback();
                }
            } catch (e) {
                // 網路錯誤、CORS阻擋、或是本機 file:/// 開啟，都會進到這裡
                showErrorFallback();
            }
        }

        // 手動上傳檔案事件 (保留手動上傳彈性)
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusIndicator.innerHTML = `🔄 檔案解析中...`;
            statusIndicator.className = "text-sm font-bold text-blue-600 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";

            if (file.name.toLowerCase().endsWith('.csv')) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) { processParsedData(results.data); },
                    error: function() { showErrorFallback(); }
                });
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    parseExcelData(data);
                };
                reader.onerror = function() { showErrorFallback(); };
                reader.readAsArrayBuffer(file);
            }
        });

        // 渲染課表邏輯
        function renderTimetable(teacherName) {
            timetableBody.innerHTML = ''; 
            
            if (!teacherName || !scheduleByTeacher[teacherName]) {
                timetableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-red-500">
                            <div class="flex flex-col items-center">
                                <svg class="w-12 h-12 text-red-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <p class="text-lg font-medium">找不到「${teacherName || '空值'}」的課表</p>
                                <p class="text-sm">請確認教師姓名是否輸入正確。</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            const teacherData = scheduleByTeacher[teacherName];
            const periods = [
                { num: 1, label: "第1節" }, { num: 2, label: "第2節" },
                { num: 3, label: "第3節" }, { num: 4, label: "第4節" },
                { num: 5, label: "第5節" }, { num: 6, label: "第6節" },
                { num: 7, label: "第7節" }, { num: 8, label: "第8節" }
            ];

            periods.forEach((p, index) => {
                const tr = document.createElement('tr');
                if (index === 3) tr.className = "table-row-sep";

                let rowHtml = `
                    <td class="px-2 py-3 border-r border-gray-200 bg-gray-50 text-gray-700 text-center whitespace-nowrap align-middle">
                        <div class="font-bold text-base mb-1">${p.label}</div>
                        <div class="text-[0.7rem] text-emerald-700 tracking-tighter leading-tight mb-0.5">國 ${juniorHighTimes[p.num]}</div>
                        <div class="text-[0.7rem] text-blue-700 tracking-tighter leading-tight">高 ${seniorHighTimes[p.num]}</div>
                    </td>`;

                for (let day = 1; day <= 5; day++) {
                    let cellContent = '<div class="h-24"></div>'; 

                    if (teacherData[day] && teacherData[day][p.num] && teacherData[day][p.num].length > 0) {
                        const classes = teacherData[day][p.num];
                        
                        classes.sort((a, b) => {
                            if (a.oddEven === '單' && b.oddEven === '雙') return -1;
                            if (a.oddEven === '雙' && b.oddEven === '單') return 1;
                            return 0;
                        });

                        let innerHtml = '';

                        classes.forEach((cellData, idx) => {
                            let clsName = cellData.className.toString().replace(/\.0$/, '');
                            const classDisplay = clsName ? `(${clsName})` : '';
                            
                            let htmlContent = `
                                <div class="font-bold text-blue-900 text-[1.1rem] mb-1">
                                    ${cellData.subject}${classDisplay}
                                </div>
                            `;
                            
                            let oddEvenString = cellData.oddEven ? ` <span class="text-red-600 font-bold">(${cellData.oddEven}週)</span>` : '';
                            htmlContent += `
                                <div class="text-sm text-gray-600 mb-1">
                                    ${cellData.timeStr}${oddEvenString}
                                </div>
                            `;
                            
                            if (cellData.location) {
                                htmlContent += `
                                    <div class="inline-block px-2 py-0.5 bg-gray-200 text-gray-700 rounded text-xs mt-1">
                                        ${cellData.location}
                                    </div>
                                `;
                            }

                            const separatorClass = idx > 0 ? "border-t-2 border-dashed border-gray-300 pt-2 mt-2" : "";
                            innerHtml += `<div class="${separatorClass}">${htmlContent}</div>`;
                        });

                        cellContent = `<div class="p-2 h-full flex flex-col justify-center">${innerHtml}</div>`;
                    }
                    rowHtml += `<td class="px-2 py-2 border-r border-gray-200 align-middle transition-colors hover:bg-blue-50">${cellContent}</td>`;
                }

                tr.innerHTML = rowHtml;
                timetableBody.appendChild(tr);
            });
        }

        searchBtn.addEventListener('click', handleSearch);
        teacherInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function handleSearch() {
            const teacherName = teacherInput.value.trim();
            if (teacherName) renderTimetable(teacherName);
        }

        // 載入完成後啟動鎖定檔名的掃描
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(attemptAutoLoad, 100);
        });

    </script>
</body>
</html>
